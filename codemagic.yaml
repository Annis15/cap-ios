workflows:
  cap-ios-testflight:
    name: Cap iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 20
    integrations:
      app_store_connect: Codemagic Cap
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fr.cap.suivi
    scripts:
      - name: Préparer l’icône et le projet Xcode
        script: |
          set -e
          mkdir -p Assets.xcassets/AppIcon.appiconset
          cp AppIcon.png Assets.xcassets/AppIcon.appiconset/
          printf '%s\n' '{"info":{"author":"xcode","version":1}}' > Assets.xcassets/Contents.json
          printf '%s\n' '{"images":[{"filename":"AppIcon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > Assets.xcassets/AppIcon.appiconset/Contents.json
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec project.yml
      - name: Signer et compiler Cap
        script: |
          set -e
          xcode-project use-profiles
          xcode-project build-ipa --project Cap.xcodeproj --scheme Cap \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
